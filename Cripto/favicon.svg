  <line x1="32" y1="4" x2="32" y2="28" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="6" y1="24" x2="58" y2="24" stroke="white" stroke-width="1" opacity="0.3"/>
  <!-- Sparkle -->
  <circle cx="42" cy="14" r="2" fill="white" opacity="0.8"/>
  <circle cx="22" cy="18" r="1.2" fill="white" opacity="0.5"/>
